{% extends "base.html" %}

{% block title %}Projects{% endblock %}

{% block content %}
  <h1>Projects</h1>
  {% if projects %}
    <ul class="project-list">
      {% for project in projects %}
        <li><a href="{{ url_for('projects.detail', project_id=project.id) }}">{{ project.name }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No projects yet.</p>
  {% endif %}
{% endblock %}
